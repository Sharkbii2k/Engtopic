        let currentTopicIndex = 0;

        // Khởi tạo danh sách 40 Topic trên Dropdown
        function initApp() {
            const select = document.getElementById('topicSelect');
            select.innerHTML = '';
            
            for (let i = 1; i <= 40; i++) {
                const foundTopic = TOPICS_DATA.find(t => t.id === i);
                const option = document.createElement('option');
                option.value = i;
                if (foundTopic) {
                    option.textContent = foundTopic.title;
                } else {
                    option.textContent = `Topic ${i}: (Chưa nạp dữ liệu)`;
                    option.disabled = true;
                }
                select.appendChild(option);
            }
            loadTopic(1);
        }

        // Phát âm tiếng Anh chuẩn
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Chuyển bài học
        function loadTopic(id) {
            const index = TOPICS_DATA.findIndex(t => t.id == id);
            if (index !== -1) {
                currentTopicIndex = index;
                reorderState = {};
                renderContent();
            }
        }

        // Chuyển Tab
        function switchTab(tabName) {
            currentTab = tabName;
            ['vocab', 'grammar', 'dialogue', 'practice'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tabName) {
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                }
            });
            renderContent();
        }

            const topic = TOPICS_DATA[currentTopicIndex];
            const container = document.getElementById('contentArea');
            container.scrollTop = 0;

            if (currentTab === 'vocab') {
                container.innerHTML = renderVocab(topic.vocab);
            } else if (currentTab === 'grammar') {
                container.innerHTML = renderGrammar(topic.grammar);
            } else if (currentTab === 'dialogue') {
                container.innerHTML = renderDialogue(topic.dialogue);
            } else if (currentTab === 'practice') {
                container.innerHTML = renderPractice(topic.exercises);
            }
        }

        // 1. Render Từ Vựng (4 cột chuẩn)
        function renderVocab(vocabList) {
            let rows = vocabList.map((v, idx) => `
                <tr class="border-b border-slate-100 hover:bg-blue-50/50 transition">
                    <td class="py-2.5 px-3 font-semibold text-blue-700 cursor-pointer flex items-center gap-2" onclick="speakText('${v.word.replace(/'/g, "\\'")}')">
                        <span class="text-xs bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded">🔊</span>
                        <span class="text-sm sm:text-base">${v.word}</span>
                    </td>
                    <td class="py-2.5 px-3 text-slate-500 font-mono text-xs sm:text-sm">${v.ipa}</td>
                    <td class="py-2.5 px-3"><span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-medium">${v.type}</span></td>
                    <td class="py-2.5 px-3 text-slate-800 text-sm sm:text-base font-medium">${v.meaning}</td>
                </tr>
            `).join('');

            return `
                <div class="mb-3 flex items-center justify-between">
                    <h2 class="text-base sm:text-lg font-bold text-slate-800">Danh sách Từ vựng (${vocabList.length} từ)</h2>
                    <span class="text-xs text-slate-500">💡 Chạm vào từ để nghe phát âm</span>
                </div>
                <div class="overflow-x-auto border border-slate-200 rounded-lg">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-xs sm:text-sm uppercase border-b border-slate-200">
                                <th class="py-2.5 px-3">Từ vựng</th>
                                <th class="py-2.5 px-3">IPA</th>
                                <th class="py-2.5 px-3">Từ loại</th>
                                <th class="py-2.5 px-3">Nghĩa</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // 2. Render Ngữ Pháp (Tô điểm nhấn công thức)
        function renderGrammar(grammarList) {
            return grammarList.map(g => `
                <div class="mb-5 last:mb-0 border border-slate-200 rounded-xl p-4 bg-slate-50/50">
                    <h3 class="text-base sm:text-lg font-bold text-blue-700 mb-1.5">${g.title}</h3>
                    <p class="text-xs sm:text-sm text-slate-600 mb-3">${g.usage}</p>
                    
                    <!-- Khung tô điểm nhấn công thức -->
                    <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-lg mb-3">
                        <div class="text-xs font-bold text-amber-800 uppercase mb-1">📌 Công thức trọng tâm:</div>
                        ${g.formula.map(f => `<div class="font-mono font-bold text-sm sm:text-base text-rose-600 py-0.5">${f}</div>`).join('')}
                        ${g.note ? `<div class="text-xs text-slate-600 mt-1.5 pt-1.5 border-t border-amber-200/60">💡 <b>Lưu ý:</b> ${g.note}</div>` : ''}
                    </div>

                    <div class="space-y-1.5">
                        <div class="text-xs font-semibold text-slate-500 uppercase">Ví dụ thực tế:</div>
                        ${g.examples.map(ex => `
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-sm flex items-start justify-between gap-2">
                                <div>
                                    <div class="font-semibold text-slate-800">${ex.en}</div>
                                    <div class="text-slate-500 text-xs sm:text-sm">${ex.vi}</div>
                                </div>
                                <button onclick="speakText('${ex.en.replace(/'/g, "\\'")}')" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded text-xs shrink-0">🔊</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 3. Render Hội Thoại
        function renderDialogue(dialogueList) {
            let lines = dialogueList.map((d, idx) => {
                const isFirstSpeaker = idx === 0 || d.speaker === dialogueList[0].speaker;
                return `
                    <div class="flex flex-col ${isFirstSpeaker ? 'items-start' : 'items-end'}">
                        <span class="text-xs font-bold text-slate-400 mb-1 px-1">${d.speaker}</span>
                        <div class="max-w-[90%] sm:max-w-[80%] rounded-2xl px-4 py-2.5 border ${isFirstSpeaker ? 'bg-slate-50 border-slate-200 rounded-tl-none' : 'bg-blue-50 border-blue-200 rounded-tr-none'}">
                            <div class="flex items-center justify-between gap-3">
                                <span class="font-semibold text-slate-800 text-sm sm:text-base">${d.en}</span>
                                <button onclick="speakText('${d.en.replace(/'/g, "\\'")}')" class="text-blue-600 hover:bg-blue-100 p-1 rounded text-xs shrink-0">🔊</button>
                            </div>
                            <div class="text-xs sm:text-sm text-slate-500 mt-1">${d.vi}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="mb-4 flex items-center justify-between border-b border-slate-100 pb-2.5">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800">Hội thoại giao tiếp (${dialogueList.length} câu)</h2>
                        <p class="text-xs text-slate-500">Bấm vào loa từng câu để luyện nghe và nhại lại (Shadowing)</p>
                    </div>
                </div>
                <div class="space-y-3 pb-2">${lines}</div>
            `;
        }

        // 4. Render Bài Tập Tương Tác (3 dạng bài tập)
        function renderPractice(ex) {
            // Dạng 1: Trắc nghiệm
            let quizHtml = ex.quiz.map((q, qIdx) => `
                <div class="p-3.5 bg-slate-50 rounded-lg border border-slate-200">
                    <div class="font-semibold text-sm sm:text-base mb-2.5">${qIdx + 1}. ${q.q}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, oIdx) => `
                            <button onclick="checkQuiz(${qIdx},${oIdx}, ${q.answer}, this)" class="quiz-btn-${qIdx} text-left text-xs sm:text-sm p-2.5 rounded-lg border border-slate-300 bg-white hover:bg-blue-50 transition font-medium">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-msg-${qIdx}" class="text-xs font-bold mt-2 hidden"></div>
                </div>
            `).join('');

            // Dạng 2: Điền từ vào câu giao tiếp
            let fillHtml = ex.fill.map((f, fIdx) => `
                <div class="p-3.5 bg-slate-50 rounded-lg border border-slate-200">
                    <div class="text-sm sm:text-base font-medium mb-2">
                        <span class="font-bold">${fIdx + 1}.</span> ${f.sentence} 
                        <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded ml-1">(Gợi ý: ${f.hint})</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="fill-input-${fIdx}" placeholder="Nhập từ tiếng Anh..." class="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:border-blue-500">
                        <button onclick="checkFill(${fIdx}, '${f.answer.replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-lg transition">Kiểm tra</button>
                    </div>
                    <div id="fill-msg-${fIdx}" class="text-xs font-bold mt-2 hidden"></div>
                </div>
            `).join('');

            // Dạng 3: Sắp xếp câu phản xạ giao tiếp
            let reorderHtml = ex.reorder.map((r, rIdx) => {
                if (!reorderState[rIdx]) reorderState[rIdx] = [];
                return `
                    <div class="p-3.5 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="text-xs sm:text-sm text-slate-500 mb-1">Dịch và ghép thành câu hoàn chỉnh:</div>
                        <div class="font-semibold text-sm sm:text-base text-slate-800 mb-2.5">"${r.vi}"</div>
                        
                        <!-- Khung chứa câu đã chọn -->
                        <div id="reorder-box-${rIdx}" class="min-h-[42px] bg-white border border-dashed border-slate-300 rounded-lg p-2 mb-2.5 flex flex-wrap gap-1.5 items-center text-sm font-semibold text-blue-700">
                            <span class="text-xs text-slate-400 font-normal">Chạm vào các từ bên dưới để ghép câu...</span>
                        </div>

                        <!-- Các từ để chọn -->
                        <div class="flex flex-wrap gap-1.5 mb-2.5">
                            ${r.words.map((w) => `
                                <button onclick="addWordReorder(${rIdx}, '${w.replace(/'/g, "\\'")}', '${r.answer.replace(/'/g, "\\'")}')" class="bg-white border border-slate-300 hover:border-blue-500 text-slate-700 text-xs sm:text-sm font-medium px-2.5 py-1 rounded shadow-2xs transition">
                                    ${w}
                                </button>
                            `).join('')}
                            <button onclick="resetReorder(${rIdx})" class="text-xs text-rose-600 hover:underline ml-auto px-2 py-1">🔄 Làm lại</button>
                        </div>
                        <div id="reorder-msg-${rIdx}" class="text-xs font-bold hidden"></div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-blue-700 uppercase tracking-wide mb-3">Phần A: Trắc nghiệm Từ vựng & Phản xạ</h3>
                        <div class="space-y-3">${quizHtml}</div>
                    </div>
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-blue-700 uppercase tracking-wide mb-3">Phần B: Điền từ vào ngữ cảnh</h3>
                        <div class="space-y-3">${fillHtml}</div>
                    </div>
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-blue-700 uppercase tracking-wide mb-3">Phần C: Ghép câu giao tiếp thực tế</h3>
                        <div class="space-y-3">${reorderHtml}</div>
                    </div>
                </div>
            `;
        }

        // Logic chấm điểm Trắc nghiệm
        function checkQuiz(qIdx, selectedIdx, correctIdx, btnElement) {
            const buttons = document.querySelectorAll(`.quiz-btn-${qIdx}`);
            const msg = document.getElementById(`quiz-msg-${qIdx}`);
            buttons.forEach(b => b.classList.remove('bg-emerald-100', 'border-emerald-500', 'bg-rose-100', 'border-rose-500'));
            
            msg.classList.remove('hidden');
            if (selectedIdx === correctIdx) {
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500');
                msg.textContent = "🎉 Chính xác!";
                msg.className = "text-xs font-bold mt-2 text-emerald-600";
            } else {
                btnElement.classList.add('bg-rose-100', 'border-rose-500');
                msg.textContent = "❌ Chưa đúng, hãy thử lại nhé!";
                msg.className = "text-xs font-bold mt-2 text-rose-600";
            }
        }

        // Logic chấm điểm Điền từ
        function checkFill(fIdx, correctAnswer) {
            const input = document.getElementById(`fill-input-${fIdx}`).value.trim().toLowerCase();
            const msg = document.getElementById(`fill-msg-${fIdx}`);
            msg.classList.remove('hidden');

            if (input === correctAnswer.toLowerCase()) {
                msg.textContent = `🎉 Tuyệt vời! Đáp án chuẩn: "${correctAnswer}"`;
                msg.className = "text-xs font-bold mt-2 text-emerald-600";
                speakText(correctAnswer);
            } else {
                msg.textContent = `❌ Chưa chính xác. Hãy kiểm tra lại chính tả nhé!`;
                msg.className = "text-xs font-bold mt-2 text-rose-600";
            }
        }

        // Logic Ghép câu
        function addWordReorder(rIdx, word, correctAnswer) {
            if (!reorderState[rIdx]) reorderState[rIdx] = [];
            reorderState[rIdx].push(word);
            
            const box = document.getElementById(`reorder-box-${rIdx}`);
            const currentSentence = reorderState[rIdx].join(' ');
            box.innerHTML = reorderState[rIdx].map(w => `<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded">${w}</span>`).join(' ');

            const msg = document.getElementById(`reorder-msg-${rIdx}`);
            if (currentSentence === correctAnswer) {
                msg.classList.remove('hidden');
                msg.textContent = "🎉 Chuẩn xác! Bạn đã ghép đúng câu giao tiếp.";
                msg.className = "text-xs font-bold text-emerald-600";
                speakText(correctAnswer);
            } else if (reorderState[rIdx].length >= correctAnswer.split(' ').length) {
                msg.classList.remove('hidden');
                msg.textContent = "❌ Thứ tự từ chưa đúng, hãy bấm 'Làm lại' nhé!";
                msg.className = "text-xs font-bold text-rose-600";
            }
        }

        function resetReorder(rIdx) {
            reorderState[rIdx] = [];
            document.getElementById(`reorder-box-${rIdx}`).innerHTML = `<span class="text-xs text-slate-400 font-normal">Chạm vào các từ bên dưới để ghép câu...</span>`;
            document.getElementById(`reorder-msg-${rIdx}`).classList.add('hidden');
        }

        window.onload = initApp;
    </script>
</body>
</html>
